<app-header></app-header>

<div class="companies-container">
    <div class="left-panel">
        <div class="left-content">
            <div class="hero-text">
                <h2>Gestión de<br><span>Compañias</span></h2>
                <p>Administra los perfiles de compañias registradas en el sistema.</p>
            </div>
            <div class="stats-summary">
                <div class="stat-item">
                    <div class="stat-number">{{getTotalCompanies()}}</div>
                    <div class="stat-label">Total Compañias</div>
                </div>
                
            </div>
        </div>
        <div class="decorative-circles">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
            <div class="circle circle-4"></div>
        </div>
    </div>

    <div class="right-panel">
        <div class="companies-header">
            <div class="header-title">
                <h1>Gestión de Compañias</h1>
                <p class="subtitle">Visualiza y administra todas las compañias registradas</p>
            </div>
            
        </div>

        <div class="companies-grid">
            @for(company of company.companies; track company.id_compania){
                <mat-card class="company-card" appearance="outlined">
                    <div class="company-card-header">
                        <div class="company-name">
                            <h3>{{company.nombre}}</h3>
                            <span class="role-name">Empresa</span>
                        </div>
                    </div>

                    <div class="company-image-container">
                        <img [src]="getImageUrl(company.logo)" alt="Foto de perfil">
                    </div>

                    

                    <div class="company-actions">
                        <button mat-button class="action-btn edit-btn" matTooltip="Editar compañia">
                            <mat-icon>edit</mat-icon>
                            <span>Editar</span>
                        </button>
                        <button mat-button class="action-btn delete-btn" matTooltip="Dar de baja">
                            <mat-icon>remove_circle_outline</mat-icon>
                            <span>Eliminar</span>
                        </button>
                    </div>
                </mat-card>
            
            }
        </div>

        <button mat-fab class="fab-button" color="primary" routerLink="/register-company" matTooltip="Registrar nueva compañia">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</div>

<app-header></app-header>
<div class="profile-container">
    <mat-card class="profile-card">
        <mat-card-header>
            <mat-card-title>Mi Perfil</mat-card-title>
            <mat-card-subtitle>Gestiona tu información personal y foto de perfil</mat-card-subtitle>
        </mat-card-header>

        <form [formGroup]="profileForm" (ngSubmit)="onUpdate()" class="profile-layout">
            <div class="photo-section">
                <div class="image-wrapper">
                    <img [src]="previewUrl" alt="Foto de perfil">
                    <label class="upload-btn">
                        <mat-icon>edit</mat-icon>
                        <input type="file" (change)="onFileSelected($event)" accept="image/*" hidden>
                    </label>
                </div>
                <p class="hint">Haz clic en el lápiz para cambiar tu foto (Formato BLOB requerido)</p> 
            </div>

            <div class="fields-section">
                <div class="form-row">
                    <mat-form-field appearance="outline">
                        <mat-label>Nombre(s)</mat-label>
                        <input matInput formControlName="name">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Apellido(s)</mat-label>
                        <input matInput formControlName="lastName">
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Alias</mat-label>
                    <input matInput formControlName="alias">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Correo Electrónico</mat-label>
                    <input matInput formControlName="email">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nueva Contraseña (dejar en blanco para no cambiar)</mat-label> 
                    <input type="password" matInput formControlName="password">
                    <mat-hint>Mínimo 8 caracteres si decides cambiarla</mat-hint>
                </mat-form-field>

                <button mat-raised-button color="primary" class="update-button" [disabled]="!profileForm.valid">
                    GUARDAR CAMBIOS
                </button>
            </div>
        </form>
    </mat-card>
</div>

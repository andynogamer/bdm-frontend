<mat-toolbar color="primary" class="main-header mat-elevation-z4">
    <div class="logo-container" routerLink="/home">
        <mat-icon class="logo-icon">directions_car</mat-icon>
        <span>Gestión LMAD</span>
    </div>

    <span class="example-spacer"></span>

    <section class="navbar-section">
        <button mat-button routerLink="/home" routerLinkActive="active-link">
            <mat-icon>home</mat-icon>
            <span class="nav-label">Inicio</span>
        </button>
    @if(auth.hasRole(2)){
        <button mat-button routerLink="/users" routerLinkActive="active-link">
            <mat-icon>people</mat-icon>
            <span class="nav-label">Usuarios</span>
        </button>

        <button mat-button routerLink="/policies" routerLinkActive="active-link">
            <mat-icon>receipt_long</mat-icon>
            <span class="nav-label">Pólizas</span>
        </button>

        <button mat-button routerLink="/companies" routerLinkActive="active-link">
            <mat-icon>apartment</mat-icon>
            <span class="nav-label">Compañias</span>
        </button>
    }
        <button mat-button [matMenuTriggerFor]="profileMenu">
            <mat-icon>account_circle</mat-icon>
            <span class="nav-label">Mi Perfil</span>
        </button>

        <mat-menu #profileMenu="matMenu">
            <button mat-menu-item routerLink="/profile">
                <mat-icon>settings</mat-icon>
                <span>Configuración</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item  (click)="auth.logout()">
                <mat-icon>exit_to_app</mat-icon>
                <span>Cerrar Sesión</span>
            </button>
        </mat-menu>
    </section>
</mat-toolbar>
